<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardioQuest: Examen de Cardiopatías Congénitas</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #fafafa;
  color: #111;
  line-height: 1.5;
  min-height: 100vh;
}
#cardio-app {
  max-width: 680px;
  margin: 0 auto;
  padding: 16px;
}
.screen { display: none; animation: fadeIn 0.5s ease; }
.screen.active { display: block; }

/* ===== PANTALLA INICIO ===== */
.start-wrap { text-align: center; padding: 32px 8px; }
.heart-wrap {
  width: 72px; height: 72px; margin: 0 auto 20px;
  color: #dc2626;
  animation: heartbeat 1.4s ease-in-out infinite;
}
@keyframes heartbeat {
  0%,100%{transform:scale(1)} 14%{transform:scale(1.18)} 28%{transform:scale(1)} 42%{transform:scale(1.18)} 70%{transform:scale(1)}
}
.start-title { font-size: 30px; font-weight: 500; line-height: 1.1; margin-bottom: 8px; }
.start-sub { font-size: 16px; color: #555; margin-bottom: 20px; }
.badge-kine {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(22,163,74,0.08); color: #16a34a;
  padding: 6px 14px; border-radius: 20px;
  font-size: 13px; font-weight: 500;
  border: 1px solid rgba(22,163,74,0.2);
  margin-bottom: 20px;
}
.feat-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; max-width: 360px; margin: 0 auto 24px;
}
.feat-card {
  background: #fff; border: 1px solid #e5e5e5;
  border-radius: 10px; padding: 14px 6px;
  display: flex; flex-direction: column;
  align-items: center; gap: 6px;
}
.feat-icon { width: 24px; height: 24px; color: #555; }
.feat-label { font-size: 12px; color: #555; font-weight: 500; }
.btn-main {
  background: #111; color: #fff; border: none;
  padding: 14px 36px; font-size: 16px; font-weight: 500;
  border-radius: 10px; cursor: pointer;
  transition: transform .15s, opacity .15s;
  display: inline-flex; align-items: center; gap: 8px;
  font-family: inherit;
}
.btn-main:hover { transform: scale(1.03); opacity: .9; }
.btn-main:active { transform: scale(.97); }

/* ===== EXAMEN ===== */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; margin-bottom: 8px;
  position: sticky; top: 0; background: #fafafa; z-index: 5;
}
.streak-box {
  display: flex; align-items: center; gap: 4px;
  font-size: 14px; font-weight: 500; color: #ca8a04;
}
.prog-wrap { flex: 1; margin: 0 14px; }
.prog-track {
  height: 7px; background: #eee;
  border-radius: 4px; overflow: hidden;
}
.prog-fill {
  height: 100%; background: #111;
  border-radius: 4px;
  transition: width .4s cubic-bezier(.4,0,.2,1);
  width: 0;
}
.timer-box {
  display: flex; align-items: center; gap: 5px;
  font-variant-numeric: tabular-nums;
  font-size: 14px; font-weight: 500;
  color: #555; min-width: 64px;
  justify-content: flex-end;
}
.timer-box.urgent { color: #dc2626; animation: pulse 1s infinite; }

.q-card {
  background: #fff; border: 1px solid #e5e5e5;
  border-radius: 14px; padding: 22px;
  margin-bottom: 14px; animation: slideUp .4s ease;
}
.q-num {
  font-size: 12px; font-weight: 500;
  color: #888; text-transform: uppercase;
  letter-spacing: .5px; margin-bottom: 6px;
}
.q-text { font-size: 17px; font-weight: 500; line-height: 1.4; margin-bottom: 18px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  width: 100%; text-align: left;
  padding: 14px 16px;
  border: 1.5px solid #e5e5e5;
  border-radius: 10px; background: #fff;
  font-size: 15px; font-family: inherit;
  cursor: pointer; transition: all .18s ease;
  display: flex; align-items: center; gap: 10px;
  position: relative;
}
.opt:hover:not(:disabled) {
  border-color: #111; background: #f5f5f5;
  transform: translateX(3px);
}
.opt:active:not(:disabled) { transform: scale(.98); }
.opt .let {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 7px; background: #eee;
  font-weight: 500; font-size: 13px;
  flex-shrink: 0; transition: all .2s;
}
.opt.corr {
  border-color: #16a34a;
  background: rgba(22,163,74,0.06);
  animation: correctPulse .5s ease;
}
.opt.corr .let { background: #16a34a; color: #fff; }
.opt.wrg {
  border-color: #dc2626;
  background: rgba(220,38,38,0.06);
  animation: shake .5s ease;
}
.opt.wrg .let { background: #dc2626; color: #fff; }
.opt:disabled { cursor: default; opacity: .85; }

.feed {
  margin-top: 14px; padding: 12px 14px;
  border-radius: 8px; font-size: 14px;
  display: flex; align-items: flex-start; gap: 8px;
  animation: fadeIn .3s ease;
}
.feed.ok { background: rgba(22,163,74,0.1); color: #16a34a; }
.feed.bad { background: rgba(220,38,38,0.1); color: #dc2626; }

.nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 20px; }
.nav-btn {
  padding: 10px 18px;
  border: 1.5px solid #e5e5e5;
  background: #fff; border-radius: 8px;
  font-size: 14px; font-family: inherit;
  cursor: pointer; display: inline-flex;
  align-items: center; gap: 6px;
  transition: all .2s; color: #111;
}
.nav-btn:hover:not(:disabled) { background: #f5f5f5; border-color: #111; }
.nav-btn:disabled { opacity: .4; cursor: not-allowed; }

/* ===== RESULTADOS ===== */
.res-wrap { padding: 20px 0; text-align: center; }
.score-ring {
  width: 140px; height: 140px;
  border-radius: 50%; border: 5px solid #e5e5e5;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  margin: 0 auto 20px;
  transition: border-color .6s;
}
.score-ring.exc { border-color: #16a34a; }
.score-ring.good { border-color: #ca8a04; }
.score-ring.low { border-color: #dc2626; }
.score-val { font-size: 36px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.score-lbl { font-size: 13px; color: #555; margin-top: 4px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 20px; }
.stat-box { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 14px; text-align: center; }
.stat-v { font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat-l { font-size: 12px; color: #555; margin-top: 3px; }

.medals-title { font-size: 16px; font-weight: 500; margin-bottom: 12px; }
.medals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.medal {
  background: #fff; border: 1.5px solid #e5e5e5;
  border-radius: 10px; padding: 14px 6px;
  display: flex; flex-direction: column;
  align-items: center; gap: 6px;
  opacity: .45; filter: grayscale(1);
  transition: all .3s;
}
.medal.on {
  opacity: 1; filter: grayscale(0);
  border-color: #ca8a04;
  background: rgba(202,138,4,0.05);
  animation: medalPop .5s cubic-bezier(.34,1.56,.64,1);
}
.medal-icon { width: 30px; height: 30px; }
.medal-name { font-size: 12px; font-weight: 500; }
.medal-desc { font-size: 10px; color: #888; text-align: center; }

.review { text-align: left; margin-top: 8px; }
.review-title { font-size: 16px; font-weight: 500; margin-bottom: 10px; text-align: center; }
.rev-item {
  background: #fff; border: 1px solid #e5e5e5;
  border-radius: 8px; padding: 12px 14px;
  margin-bottom: 8px; display: flex;
  align-items: flex-start; gap: 10px;
}
.rev-icon { width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; }
.rev-txt { font-size: 13px; line-height: 1.5; flex: 1; }
.rev-ans { font-size: 12px; color: #888; margin-top: 3px; }

.confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; overflow: hidden; }
.cf-piece { position: absolute; width: 8px; height: 8px; top: -10px; animation: cfFall linear forwards; }
@keyframes cfFall { 0%{transform:translateY(0) rotate(0deg); opacity:1} 100%{transform:translateY(100vh) rotate(720deg); opacity:0} }

@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
@keyframes correctPulse { 0%{transform:scale(1)} 40%{transform:scale(1.02)} 100%{transform:scale(1)} }
@keyframes medalPop { 0%{transform:scale(.5);opacity:0} 100%{transform:scale(1);opacity:1} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

@media (max-width: 480px) {
  .feat-grid { grid-template-columns: 1fr; }
  .medals { grid-template-columns: repeat(2, 1fr); }
  .stats { grid-template-columns: 1fr; }
  .start-title { font-size: 24px; }
  .q-text { font-size: 15px; }
}
</style>
</head>
<body>

<div id="cardio-app">
  <!-- PANTALLA INICIO -->
  <div class="screen active" id="scr-start">
    <div class="start-wrap">
      <div class="heart-wrap">
        <svg viewBox="0 0 24 24" fill="currentColor" width="72" height="72">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <h1 class="start-title">CardioQuest</h1>
      <p class="start-sub">50 preguntas de cardiopatías congénitas basadas en fichas clínicas</p>
      <div class="badge-kine">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        Modo kinestésico
      </div>
      <div class="feat-grid">
        <div class="feat-card">
          <svg class="feat-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
          <span class="feat-label">50 preguntas</span>
        </div>
        <div class="feat-card">
          <svg class="feat-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          <span class="feat-label">7 fichas</span>
        </div>
        <div class="feat-card">
          <svg class="feat-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0011 15.9V19H7v2h10v-2h-4v-3.1a5.01 5.01 0 003.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg>
          <span class="feat-label">Medallas</span>
        </div>
      </div>
      <button class="btn-main" onclick="startQuiz()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Iniciar examen
      </button>
    </div>
  </div>

  <!-- PANTALLA EXAMEN -->
  <div class="screen" id="scr-quiz">
    <div class="topbar">
      <div class="streak-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span id="streakVal">0</span>
      </div>
      <div class="prog-wrap"><div class="prog-track"><div class="prog-fill" id="progFill"></div></div></div>
      <div class="timer-box" id="timerBox">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
        <span id="timerVal">00:00</span>
      </div>
    </div>
    <div class="q-card" id="qCard">
      <div class="q-num" id="qNum">Pregunta 1 de 50</div>
      <div class="q-text" id="qText"></div>
      <div class="opts" id="opts"></div>
      <div id="feedArea"></div>
    </div>
    <div class="nav">
      <button class="nav-btn" id="btnPrev" onclick="prevQ()" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        Anterior
      </button>
      <button class="nav-btn" id="btnNext" onclick="nextQ()" disabled>
        <span id="nextLabel">Siguiente</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>
    </div>
  </div>

  <!-- PANTALLA RESULTADOS -->
  <div class="screen" id="scr-res">
    <div class="res-wrap">
      <div class="score-ring" id="scoreRing">
        <div class="score-val" id="scoreVal">0/50</div>
        <div class="score-lbl" id="scoreLbl">Respuestas correctas</div>
      </div>
      <div class="stats">
        <div class="stat-box"><div class="stat-v" id="statAcc">0%</div><div class="stat-l">Precisión</div></div>
        <div class="stat-box"><div class="stat-v" id="statTime">00:00</div><div class="stat-l">Tiempo</div></div>
        <div class="stat-box"><div class="stat-v" id="statStreak">0</div><div class="stat-l">Mejor racha</div></div>
      </div>
      <div class="medals-title">Medallas obtenidas</div>
      <div class="medals" id="medalsBox"></div>
      <div class="review">
        <div class="review-title">Revisión de errores</div>
        <div id="reviewBox"></div>
      </div>
      <button class="btn-main" onclick="restartQuiz()" style="margin-top:20px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        Reintentar
      </button>
    </div>
  </div>
</div>
<div class="confetti" id="confetti" style="display:none"></div>

<script>
const DATA = [
  {q:"¿Cuál es la cardiopatía cianótica más frecuente en niños >1 año?",o:["TGA","Tetralogía de Fallot","Atresia tricúspide","Canal AV"],c:1,f:"TOF",e:"TOF es la cardiopatía cianótica más frecuente >1 año (5-7% de CC)."},
  {q:"¿Qué % de TOF está asociado a síndrome de DiGeorge (22q11)?",o:["5%","15%","30%","50%"],c:1,f:"TOF",e:"15% asociada a DiGeorge 22q11 y también a Síndrome de Down."},
  {q:"¿Cuáles son los 4 componentes de la Tetralogía de Fallot?",o:["CIA+CIV+EP+HVI","CIV+EP+Cabalgamiento aórtico+HVD","CIV+EA+HVD+Cabalgamiento pulmonar","CIA+Coartación+HVI+CIV"],c:1,f:"TOF",e:"CIV + Estenosis pulmonar + Cabalgamiento aórtico + HVD."},
  {q:"¿Qué ocurre con el soplo durante un 'spell' hipoxémico en TOF?",o:["Aumenta","Disminuye por aumento del shunt D-I","Se vuelve holosistólico","Desaparece"],c:1,f:"TOF",e:"El soplo DISMINUYE durante el spell por aumento del shunt derecha-izquierda."},
  {q:"¿Cuál es el hallazgo radiológico patognomónico de TOF?",o:["Huevo con pedículo","Cardiomegalia 4 cavidades","Corazón en bota + oligohemia","Nariz de perro"],c:2,f:"TOF",e:"Rx 'corazón en bota' + oligohemia pulmonar."},
  {q:"¿Qué posición adoptan los niños con TOF para aliviar la cianosis?",o:["Decúbito supino","Cuclillas (squatting)","Decúbito prono","Sentado inclinado"],c:1,f:"TOF",e:"Se calman en cuclillas, aumentando la resistencia vascular sistémica."},
  {q:"En el ECG de TOF, ¿qué hallazgo espera?",o:["Eje izquierdo + HBAI","Eje derecho + HVD","Eje izquierdo + HVI","Patrón WPW"],c:1,f:"TOF",e:"ECG: Eje derecho + HVD."},
  {q:"¿Cómo diferencia radiológicamente TOF de TGA?",o:["TOF hiperflujo, TGA oligohemia","TOF oligohemia, TGA hiperflujo","Ambas oligohemia","Ambas cardiomegalia"],c:1,f:"TOF",e:"En TOF hay oligohemia; en TGA hay hiperflujo pulmonar."},
  {q:"¿Cuál es la 2da causa de cianosis en el recién nacido?",o:["TOF","Atresia tricúspide","TGA","Canal AV"],c:2,f:"TGA",e:"TGA es la 2da causa de cianosis en RN (5-7% de CC)."},
  {q:"En d-TGA, ¿de dónde nace la aorta?",o:["VI","VD","AD","Tronco arterial"],c:1,f:"TGA",e:"Aorta sale del VD y pulmonar del VI; circulaciones en paralelo."},
  {q:"¿Qué % de TGA tiene CIV asociada?",o:["10%","30%","50%","70%"],c:1,f:"TGA",e:"30% de los pacientes con TGA tienen CIV asociada."},
  {q:"¿Cuál es el hallazgo radiológico característico de TGA?",o:["Corazón en bota","Cardiomegalia + punta levantada","Huevo con pedículo estrecho + hiperflujo","Nariz de perro"],c:2,f:"TGA",e:"Rx 'huevo con pedículo estrecho' + hiperflujo pulmonar."},
  {q:"¿Qué se ausculta en TGA con septum íntegro?",o:["Soplo holosistólico intenso","Sin soplo","Soplo eyectivo mesosistólico","Soplo diastólico de IA"],c:1,f:"TGA",e:"Sin CIV y septum íntegro: no hay soplo. S2 único e intenso."},
  {q:"¿En qué tiempo aparece la cianosis en TGA?",o:[">72h","24-48h","Precoz <24h","7 días"],c:2,f:"TGA",e:"Cianosis precoz <24h. Dato clave: cianosis precoz + poco soplo = TGA."},
  {q:"¿Qué defecto permite la mezcla en TGA?",o:["Solo CIV","CIA, CIV o PCA","Solo PCA","Solo CIA"],c:1,f:"TGA",e:"Depende de mezcla: CIA, CIV o PCA. Sin mezcla no sobrevive."},
  {q:"¿Qué hallazgo ECG diferencia TGA de Atresia tricúspide?",o:["HVD en TGA vs HVI en AT","HVI en ambas","Sin Q en V5-V6 en TGA","Eje izquierdo en ambas"],c:2,f:"TGA",e:"En TGA hay HVD y sin Q en V5-V6."},
  {q:"¿Qué % de Canales AV está asociado a Síndrome de Down?",o:["10-20%","40-50%","60-70%","80-90%"],c:1,f:"Canal AV",e:"40-50% asociado a Down; también trisomías 18 y 13."},
  {q:"¿Cuáles son los componentes del Canal AV completo?",o:["CIA secundum + CIV","CIA primum + CIV + válvula AV común","CIV + válvula aórtica bicúspide","CIA + estenosis pulmonar"],c:1,f:"Canal AV",e:"CIA ostium primum + CIV + válvula AV común (5 valvas en eco)."},
  {q:"¿Qué hallazgo ECG es patognomónico del Canal AV?",o:["Eje derecho + HVD","Eje izquierdo marcado (-30° a -90°) + HBAI + PR largo","Patrón Brugada","Bloqueo rama derecha"],c:1,f:"Canal AV",e:"Eje izquierdo marcado + HBAI + PR largo. Dato clave: eje izquierdo en niño = Canal AV."},
  {q:"¿Qué soplos se auscultan en Canal AV por la válvula común?",o:["Solo CIV","3 soplos: CIV + IM + IT","Solo diastólico","Soplo continuo"],c:1,f:"Canal AV",e:"Holosistólico de CIV + diastólico de IM en ápex + IT."},
  {q:"¿Cuál es la clínica del Canal AV completo en lactantes?",o:["Cianosis desde el nacimiento","IC: taquipnea, diaforesis, mala ganancia","Síncope de esfuerzo","Asintomático"],c:1,f:"Canal AV",e:"IC precoz: taquipnea, diaforesis, mala ganancia, IRAS repetidas."},
  {q:"¿Qué hallazgo radiológico espera en Canal AV?",o:["Oligohemia","Cardiomegalia 4 cavidades + hiperflujo","Corazón en bota","Huevo con pedículo"],c:1,f:"Canal AV",e:"Cardiomegalia en 4 cavidades + hiperflujo pulmonar."},
  {q:"¿Qué asociación clínica sugiere Canal AV completo?",o:["Down + cianosis","Down + IC precoz","Williams + síncope","Noonan + soplo eyectivo"],c:1,f:"Canal AV",e:"Down + IC precoz = piensa en canal AV completo."},
  {q:"¿Cuál es el germen más frecuente en EI aguda?",o:["Streptococcus viridans","Staphylococcus aureus","HACEK","Enterococo"],c:1,f:"EI",e:"Aguda: S. aureus. Subaguda: Streptococcus viridans."},

  {q:"¿Qué fenómeno inmune de EI son nódulos dolorosos en pulpejos?",o:["Janeway","Osler","Petequias","Hematuria"],c:1,f:"EI",e:"Osler = nódulos dolorosos en pulpejos (inmune). Janeway = indoloro."},
  {q:"¿Qué criterio de Duke mayor confirma EI?",o:["Fiebre >38°C 5 días","2 hemocultivos + vegetación en eco","Anemia + VSG elevada","Soplo nuevo"],c:1,f:"EI",e:"Duke: 2 mayores = 2 hemocultivos positivos + vegetación en eco."},
  {q:"¿Qué hallazgo obliga a sospechar EI en cardiopatía conocida?",o:["Cianosis nueva","Soplo nuevo o cambio de soplo","Taquicardia sinusal","Hepatomegalia"],c:1,f:"EI",e:"Soplo nuevo en cardiopatía = EI hasta demostrar lo contrario."},
  {q:"¿Cuál es la incidencia de EI en niños?",o:["5-10/100000/año","0.5-1.5/100000/año","20-30/100000/año","50/100000/año"],c:1,f:"EI",e:"0.5-1.5 casos/100,000 niños/año. Más en CC previa o prótesis."},
  {q:"¿Qué grupo HACEK se asocia a mala higiene dental?",o:["Haemophilus, Actinobacillus, Cardiobacterium, Eikenella, Kingella","Helicobacter, Acinetobacter, Citrobacter","Staph, Strep","Pseudomonas, Klebsiella"],c:0,f:"EI",e:"HACEK: Haemophilus, Actinobacillus, Cardiobacterium, Eikenella, Kingella."},
  {q:"¿Cuál es la causa más frecuente de EA valvular?",o:["Reumática","Válvula bicúspide 50-80%","Degeneración calcica","Endocarditis"],c:1,f:"EA",e:"Valvular: bicúspide 50-80%. Subvalvular: membrana. Supravalvular: Williams."},
  {q:"¿Cuál es la tríada sintomática de EA severa?",o:["Cianosis, acropaquia, spells","Disnea, angina, síncope de esfuerzo","Taquipnea, diaforesis, mala ganancia","Hepatomegalia, edema, ascitis"],c:1,f:"EA",e:"Tríada: disnea, angina, síncope de esfuerzo. Dato clave: síncope en niño = EA severa."},
  {q:"¿Cómo responde el soplo de EA con Valsalva?",o:["Aumenta","Disminuye","No cambia","Se vuelve continuo"],c:1,f:"EA",e:"DISMINUYE con Valsalva y AUMENTA con ejercicio. Diferencia clave con EP."},
  {q:"¿Qué pulso se asocia a EA?",o:["Water-hammer","Parvus et tardus","Alternante","Bigeminado"],c:1,f:"EA",e:"Pulso parvus et tardus + soplo que irradia a carótidas."},
  {q:"¿Dónde se localiza el soplo de EA?",o:["2° EICI","2° EICD que irradia a carótidas","Ápex","BEI inferior"],c:1,f:"EA",e:"Eyectivo 2° EICD que irradia a carótidas + chasquido + S2 disminuido."},
  {q:"¿Qué síndrome se asocia a EA supravalvular?",o:["Down","Williams","Noonan","DiGeorge"],c:1,f:"EA",e:"Supravalvular: Williams. Subvalvular: membrana. Valvular: bicúspide."},
  {q:"¿Qué hallazgo en palpación se asocia a EA?",o:["Martillo de agua","Frémito 2° EICD + impulso apical sostenido","Levantamiento parasternal","Apex normal"],c:1,f:"EA",e:"Frémito 2° EICD + pulso parvus et tardus + impulso apical sostenido."},
  {q:"¿Qué % de cardiopatías representa la estenosis pulmonar?",o:["1-3%","3-6%","7-10%","15-20%"],c:2,f:"EP",e:"7-10% de CC. Más frecuente en mujeres."},
  {q:"¿Qué maniobra aumenta el soplo de EP?",o:["Valsalva","Inspiración","Expiración","Cuclillas"],c:1,f:"EP",e:"El soplo AUMENTA en inspiración. Diferencia clave con EA."},
  {q:"¿Cuál es el hallazgo radiológico característico de EP?",o:["Corazón en bota","Huevo con pedículo","Tronco pulmonar dilatado postestenótico (nariz de perro)","Cardiomegalia 4 cavidades"],c:2,f:"EP",e:"Rx 'nariz de perro' por dilatación postestenótica + oligohemia."},
  {q:"¿Qué hallazgo en S2 es característico de EP?",o:["S2 fisiológico","S2 amplio con P2 disminuido","S2 único","Clic de apertura"],c:1,f:"EP",e:"S2 amplio con P2 disminuido. Chasquido valvular."},

  {q:"¿Qué causa EP supravalvular?",o:["Membrana subvalvular","Rubéola congénita","Válvula bicúspide","Noonan"],c:1,f:"EP",e:"Supravalvular: Rubéola. Subvalvular: HVD. Valvular: aislada/TOF/Noonan."},
  {q:"¿Cuál es la 3ra causa de cianosis en RN?",o:["TOF","TGA","Atresia tricúspide","Canal AV"],c:2,f:"AT",e:"3ra causa de cianosis en RN (1-3% de CC)."},
  {q:"¿Qué % de atresia tricúspide está asociado a TGA?",o:["10%","30%","50%","70%"],c:3,f:"AT",e:"70% asociada a TGA. Defecto en desarrollo de válvula tricúspide."},
  {q:"¿Qué hallazgo ECG diferencia AT de otras cianóticas?",o:["Eje derecho + HVD","Eje izquierdo + HVI + sin fuerzas derechas","Eje normal","WPW"],c:1,f:"AT",e:"Eje izquierdo + HVI + sin fuerzas derechas. Dato clave en cianótico."},
  {q:"¿Por qué no hay Q en V5-V6 en AT?",o:["Bloqueo rama izquierda","Ausencia de VD","Hipertrofia auricular","Isquemia"],c:1,f:"AT",e:"Ausencia de Q en V5-V6 por ausencia de VD (hipoplásico)."},
  {q:"¿Qué determina la clínica en AT: cianosis o IC?",o:["Presencia/ausencia de EP","Presencia/ausencia de CIA","Tamaño de CIV","Edad gestacional"],c:0,f:"AT",e:"Con EP = cianosis severa. Sin EP = IC por hiperflujo."},
  {q:"¿Qué hallazgo radiológico se observa en AT?",o:["Corazón en bota","Cardiomegalia + punta levantada + oligo/hiperflujo","Huevo con pedículo","Nariz de perro"],c:1,f:"AT",e:"Cardiomegalia + punta levantada + oligo/hiperflujo según EP."}
];

let cur=0, ans=new Array(DATA.length).fill(null), score=0, streak=0, maxStreak=0, startT=null, tmr=null;

function $(id){return document.getElementById(id)}
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}

function startQuiz(){
  cur=0; ans.fill(null); score=0; streak=0; maxStreak=0; startT=Date.now();
  show('scr-quiz'); renderQ();
  tmr=setInterval(updT,1000);
}
function updT(){
  const e=Math.floor((Date.now()-startT)/1000);
  $('timerVal').textContent=`${String(Math.floor(e/60)).padStart(2,'0')}:${String(e%60).padStart(2,'0')}`;
  if(e>1800) $('timerBox').classList.add('urgent');
}
function renderQ(){
  const q=DATA[cur];
  $('qNum').textContent=`Pregunta ${cur+1} de ${DATA.length} • ${q.f}`;
  $('qText').textContent=q.q;
  $('progFill').style.width=`${((cur+1)/DATA.length)*100}%`;
  $('opts').innerHTML=''; $('feedArea').innerHTML='';
  const lets=['A','B','C','D'];
  q.o.forEach((opt,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML=`<span class="let">${lets[i]}</span><span>${opt}</span>`;
    b.onclick=()=>sel(i);
    if(ans[cur]!==null){
      b.disabled=true;
      if(i===q.c) b.classList.add('corr');
      if(i===ans[cur]&&i!==q.c) b.classList.add('wrg');
    }
    $('opts').appendChild(b);
  });
  if(ans[cur]!==null) showFB(ans[cur]===q.c,q);
  $('btnPrev').disabled=cur===0;
  $('btnNext').disabled=ans[cur]===null;
  $('nextLabel').textContent=cur===DATA.length-1?'Finalizar':'Siguiente';
}
function sel(i){
  if(ans[cur]!==null) return;
  ans[cur]=i; const q=DATA[cur]; const ok=i===q.c;
  if(ok){score++; streak++; if(streak>maxStreak) maxStreak=streak;} else {streak=0;}
  $('streakVal').textContent=streak;
  document.querySelectorAll('.opt').forEach((b,idx)=>{
    b.disabled=true;
    if(idx===q.c) b.classList.add('corr');
    if(idx===i&&!ok) b.classList.add('wrg');
  });
  showFB(ok,q); $('btnNext').disabled=false;
}
function showFB(ok,q){
  const d=document.createElement('div'); d.className='feed '+(ok?'ok':'bad');
  d.innerHTML=(ok?'✓':'✗')+' '+q.e;
  $('feedArea').appendChild(d);
}
function nextQ(){ if(cur<DATA.length-1){cur++; renderQ();} else finish(); }
function prevQ(){ if(cur>0){cur--; renderQ();} }

function finish(){
  clearInterval(tmr); show('scr-res');
  const e=Math.floor((Date.now()-startT)/1000);
  const acc=Math.round((score/DATA.length)*100);
  $('scoreVal').textContent=`${score}/${DATA.length}`;
  $('scoreLbl').textContent=acc>=70?'¡Excelente trabajo!':acc>=50?'Buen intento':'Sigue practicando';
  $('scoreRing').className='score-ring '+(acc>=80?'exc':acc>=60?'good':'low');
  $('statAcc').textContent=`${acc}%`;
  $('statTime').textContent=`${String(Math.floor(e/60)).padStart(2,'0')}:${String(e%60).padStart(2,'0')}`;
  $('statStreak').textContent=maxStreak;
  renderMedals(acc,maxStreak,e); renderRev();
  if(acc>=70) confetti();
}

function renderMedals(acc,streak,time){
  const m=[
    {n:'Perfeccionista',d:'50/50',u:score===50,ic:'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z'},
    {n:'Experto',d:'≥90%',u:acc>=90,ic:'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z'},
    {n:'Racha',d:'≥10 seguidas',u:streak>=10,ic:'M13 2L3 14h9l-1 8 10-12h-9l1-8z'},
    {n:'Velocista',d:'<20 min',u:time<1200,ic:'M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z'},
    {n:'Corazón',d:'Completado',u:true,ic:'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'},
    {n:'Erudito',d:'≥80%',u:acc>=80,ic:'M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z'}
  ];
  $('medalsBox').innerHTML='';
  m.forEach((x,i)=>{
    const d=document.createElement('div');
    d.className='medal'+(x.u?' on':'');
    d.style.animationDelay=`${i*0.08}s`;
    d.innerHTML=`<svg class="medal-icon" viewBox="0 0 24 24" fill="${x.u?'currentColor':'#bbb'}"><path d="${x.ic}"/></svg><span class="medal-name">${x.n}</span><span class="medal-desc">${x.d}</span>`;
    $('medalsBox').appendChild(d);
  });
}

function renderRev(){
  const w=DATA.map((q,i)=>({...q,idx:i,u:ans[i]})).filter(x=>x.u!==x.c);
  const box=$('reviewBox'); box.innerHTML='';
  if(!w.length){
    box.innerHTML='<div class="rev-item" style="justify-content:center;color:#16a34a;font-weight:500;">¡Perfecto! Sin errores.</div>';
    return;
  }
  w.slice(0,8).forEach(x=>{
    const d=document.createElement('div'); d.className='rev-item';
    d.innerHTML=`<svg class="rev-icon" style="color:#dc2626" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg><div><div class="rev-txt"><strong>${x.f}:</strong> ${x.q}</div><div class="rev-ans">Correcta: ${x.o[x.c]}</div></div>`;
    box.appendChild(d);
  });
  if(w.length>8){
    const m=document.createElement('div');
    m.style.cssText='text-align:center;color:#888;font-size:12px;margin-top:6px;';
    m.textContent=`+${w.length-8} errores más...`;
    box.appendChild(m);
  }
}

function confetti(){
  const c=$('confetti'); c.style.display='block'; c.innerHTML='';
  const cols=['#dc2626','#2563eb','#16a34a','#ca8a04','#7c3aed','#111'];
  for(let i=0;i<60;i++){
    const p=document.createElement('div'); p.className='cf-piece';
    p.style.left=Math.random()*100+'vw';
    p.style.background=cols[Math.floor(Math.random()*cols.length)];
    p.style.animationDuration=(Math.random()*2+2)+'s';
    p.style.animationDelay=(Math.random()*1.5)+'s';
    c.appendChild(p);
  }
  setTimeout(()=>{c.style.display='none';},5000);
}

function restartQuiz(){ $('confetti').style.display='none'; show('scr-start'); }
</script>
